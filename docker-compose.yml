version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/ledger}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-super_secret_dev_jwt_key_12345}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      - mongo
      - redis
    networks:
      - ledger-net

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - ledger-net

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ledger-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ledger-net

networks:
  ledger-net:

volumes:
  mongo-data:
